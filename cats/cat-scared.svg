<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears (pulled back/low on head) -->
  <polygon points="48,52 58,20 82,52" fill="#F8F8F8"/>
  <polygon points="118,52 142,20 152,52" fill="#F8F8F8"/>
  <polygon points="55,52 60,32 76,52" fill="#FF3B00"/>
  <polygon points="124,52 140,32 145,52" fill="#FF3B00"/>
  <!-- Head -->
  <rect x="42" y="52" width="116" height="92" fill="#F8F8F8"/>
  <!-- Brows raised VERY HIGH (shocked) -->
  <line x1="64" y1="62" x2="88" y2="64" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="112" y1="64" x2="136" y2="62" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="square"/>
  <!-- Big scared eyes (dark squares with white highlights) -->
  <rect x="64" y="72" width="28" height="24" fill="#0A0A0A"/>
  <rect x="66" y="74" width="8" height="6" fill="#F8F8F8"/>
  <rect x="108" y="72" width="28" height="24" fill="#0A0A0A"/>
  <rect x="110" y="74" width="8" height="6" fill="#F8F8F8"/>
  <!-- Nose -->
  <rect x="96" y="108" width="8" height="6" fill="#FF3B00"/>
  <!-- Shocked open mouth (O) -->
  <rect x="91" y="114" width="18" height="14" fill="#0A0A0A"/>
  <!-- Whiskers (angled UP, scared) -->
  <line x1="42" y1="108" x2="88" y2="104" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="42" y1="116" x2="88" y2="114" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="104" x2="158" y2="108" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="114" x2="158" y2="116" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="58" y="144" width="84" height="62" fill="#F8F8F8"/>
  <!-- Collar -->
  <rect x="58" y="144" width="84" height="12" fill="#FF3B00"/>
  <rect x="94" y="155" width="12" height="10" fill="#0A0A0A"/>
  <!-- Paws -->
  <rect x="52" y="200" width="38" height="16" fill="#F8F8F8"/>
  <line x1="64" y1="200" x2="64" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="76" y1="200" x2="76" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <rect x="110" y="200" width="38" height="16" fill="#F8F8F8"/>
  <line x1="122" y1="200" x2="122" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="134" y1="200" x2="134" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Tail: PUFFED straight up (scared) -->
  <polyline points="142,185 155,148 158,102" fill="none" stroke="#F8F8F8" stroke-width="16" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Shock lines radiating from head -->
  <line x1="158" y1="42" x2="168" y2="32" stroke="#FF3B00" stroke-width="2" stroke-linecap="square"/>
  <line x1="162" y1="46" x2="174" y2="42" stroke="#FF3B00" stroke-width="2" stroke-linecap="square"/>
  <line x1="30" y1="42" x2="20" y2="32" stroke="#FF3B00" stroke-width="2" stroke-linecap="square"/>
  <line x1="26" y1="46" x2="14" y2="42" stroke="#FF3B00" stroke-width="2" stroke-linecap="square"/>
</svg>