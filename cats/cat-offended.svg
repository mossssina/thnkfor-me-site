<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears (slightly haughty tilt) -->
  <polygon points="48,52 65,8 90,52" fill="#F8F8F8"/>
  <polygon points="110,52 135,8 152,52" fill="#F8F8F8"/>
  <polygon points="55,52 65,22 83,52" fill="#FF3B00"/>
  <polygon points="117,52 135,22 145,52" fill="#FF3B00"/>
  <!-- Head -->
  <rect x="42" y="52" width="116" height="92" fill="#F8F8F8"/>
  <!-- Brows: raised haughtily (both) -->
  <line x1="64" y1="68" x2="88" y2="70" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="112" y1="70" x2="136" y2="68" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="square"/>
  <!-- Eyes: both shut (dismissive — won't look at you) -->
  <rect x="62" y="88" width="30" height="8" fill="#0A0A0A"/>
  <rect x="108" y="88" width="30" height="8" fill="#0A0A0A"/>
  <!-- Nose (slightly elevated = snobbish) -->
  <rect x="96" y="107" width="8" height="6" fill="#FF3B00"/>
  <!-- Flat dismissive mouth -->
  <line x1="84" y1="120" x2="116" y2="120" stroke="#0A0A0A" stroke-width="3" stroke-linecap="square"/>
  <!-- Whiskers -->
  <line x1="42" y1="112" x2="88" y2="114" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="42" y1="120" x2="88" y2="120" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="114" x2="158" y2="112" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="120" x2="158" y2="120" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="58" y="144" width="84" height="62" fill="#F8F8F8"/>
  <!-- Collar -->
  <rect x="58" y="144" width="84" height="12" fill="#FF3B00"/>
  <rect x="94" y="155" width="12" height="10" fill="#0A0A0A"/>
  <!-- Crossed paws (arms folded = offended) -->
  <rect x="62" y="196" width="48" height="14" fill="#F8F8F8"/>
  <line x1="74" y1="196" x2="74" y2="206" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="86" y1="196" x2="86" y2="206" stroke="#0A0A0A" stroke-width="1.5"/>
  <rect x="90" y="190" width="48" height="14" fill="#F8F8F8"/>
  <line x1="104" y1="190" x2="104" y2="200" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="116" y1="190" x2="116" y2="200" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Tail: swept hard to left (turning away) -->
  <polyline points="60,182 28,162 24,210" fill="none" stroke="#F8F8F8" stroke-width="9" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- "Hmph" steam lines from nose -->
  <line x1="100" y1="104" x2="100" y2="94" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="100" y1="94" x2="108" y2="88" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="square"/>
</svg>