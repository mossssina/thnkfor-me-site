<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears (normal) -->
  <polygon points="48,52 65,8 90,52" fill="#F8F8F8"/>
  <polygon points="110,52 135,8 152,52" fill="#F8F8F8"/>
  <polygon points="55,52 65,22 83,52" fill="#FF3B00"/>
  <polygon points="117,52 135,22 145,52" fill="#FF3B00"/>
  <!-- Head -->
  <rect x="42" y="52" width="116" height="92" fill="#F8F8F8"/>
  <!-- Heavy drooping brows -->
  <line x1="64" y1="80" x2="88" y2="78" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="112" y1="78" x2="136" y2="80" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="square"/>
  <!-- Nearly-closed sleepy eyes (solid rects = heavy lids) -->
  <rect x="62" y="90" width="30" height="6" fill="#0A0A0A"/>
  <rect x="108" y="90" width="30" height="6" fill="#0A0A0A"/>
  <!-- Nose -->
  <rect x="96" y="110" width="8" height="6" fill="#FF3B00"/>
  <!-- Yawning open mouth -->
  <rect x="90" y="112" width="20" height="16" fill="#0A0A0A"/>
  <!-- Tongue inside -->
  <rect x="93" y="124" width="14" height="5" fill="#FF3B00"/>
  <!-- Whiskers (drooping) -->
  <line x1="42" y1="112" x2="88" y2="116" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="42" y1="120" x2="88" y2="122" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="116" x2="158" y2="112" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="122" x2="158" y2="120" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="58" y="144" width="84" height="62" fill="#F8F8F8"/>
  <!-- Collar -->
  <rect x="58" y="144" width="84" height="12" fill="#FF3B00"/>
  <rect x="94" y="155" width="12" height="10" fill="#0A0A0A"/>
  <!-- Paws -->
  <rect x="52" y="200" width="38" height="16" fill="#F8F8F8"/>
  <line x1="64" y1="200" x2="64" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="76" y1="200" x2="76" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <rect x="110" y="200" width="38" height="16" fill="#F8F8F8"/>
  <line x1="122" y1="200" x2="122" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="134" y1="200" x2="134" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Tail: low, resting -->
  <polyline points="142,200 170,210 178,224" fill="none" stroke="#F8F8F8" stroke-width="9" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- ZZZ floating (angular Z shapes) -->
  <!-- Small Z -->
  <line x1="158" y1="42" x2="170" y2="42" stroke="#FF3B00" stroke-width="2" stroke-linecap="square"/>
  <line x1="170" y1="42" x2="158" y2="54" stroke="#FF3B00" stroke-width="2" stroke-linecap="square"/>
  <line x1="158" y1="54" x2="170" y2="54" stroke="#FF3B00" stroke-width="2" stroke-linecap="square"/>
  <!-- Medium Z -->
  <line x1="164" y1="26" x2="178" y2="26" stroke="#FF3B00" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="178" y1="26" x2="164" y2="40" stroke="#FF3B00" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="164" y1="40" x2="178" y2="40" stroke="#FF3B00" stroke-width="2.5" stroke-linecap="square"/>
  <!-- Large Z -->
  <line x1="168" y1="8" x2="186" y2="8" stroke="#FF3B00" stroke-width="3" stroke-linecap="square"/>
  <line x1="186" y1="8" x2="168" y2="24" stroke="#FF3B00" stroke-width="3" stroke-linecap="square"/>
  <line x1="168" y1="24" x2="186" y2="24" stroke="#FF3B00" stroke-width="3" stroke-linecap="square"/>
</svg>