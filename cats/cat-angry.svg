<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears (flattened/angled for anger) -->
  <polygon points="48,52 60,14 86,52" fill="#F8F8F8"/>
  <polygon points="114,52 140,14 152,52" fill="#F8F8F8"/>
  <polygon points="55,52 62,28 80,52" fill="#FF3B00"/>
  <polygon points="120,52 138,28 145,52" fill="#FF3B00"/>
  <!-- Head -->
  <rect x="42" y="52" width="116" height="92" fill="#F8F8F8"/>
  <!-- Angry brows: \/ shape (inner corners DOWN toward nose) -->
  <line x1="64" y1="70" x2="88" y2="80" stroke="#0A0A0A" stroke-width="3" stroke-linecap="square"/>
  <line x1="112" y1="80" x2="136" y2="70" stroke="#0A0A0A" stroke-width="3" stroke-linecap="square"/>
  <!-- Angry squinting eyes (inner corners lower) -->
  <line x1="64" y1="88" x2="88" y2="96" stroke="#0A0A0A" stroke-width="4" stroke-linecap="square"/>
  <line x1="112" y1="96" x2="136" y2="88" stroke="#0A0A0A" stroke-width="4" stroke-linecap="square"/>
  <!-- Nose -->
  <rect x="96" y="110" width="8" height="6" fill="#FF3B00"/>
  <!-- Grimace mouth -->
  <polyline points="82,118 94,122 106,122 118,118" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Whiskers (tensed, backward) -->
  <line x1="42" y1="110" x2="88" y2="114" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="42" y1="118" x2="88" y2="118" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="114" x2="158" y2="110" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="118" x2="158" y2="118" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="58" y="144" width="84" height="62" fill="#F8F8F8"/>
  <!-- Collar -->
  <rect x="58" y="144" width="84" height="12" fill="#FF3B00"/>
  <rect x="94" y="155" width="12" height="10" fill="#0A0A0A"/>
  <!-- Paws -->
  <rect x="52" y="200" width="38" height="16" fill="#F8F8F8"/>
  <line x1="64" y1="200" x2="64" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="76" y1="200" x2="76" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <rect x="110" y="200" width="38" height="16" fill="#F8F8F8"/>
  <line x1="122" y1="200" x2="122" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="134" y1="200" x2="134" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Tail: stiff straight up (angry) -->
  <polyline points="142,185 148,120 145,100" fill="none" stroke="#F8F8F8" stroke-width="9" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Anger marks × (top right) -->
  <line x1="162" y1="52" x2="174" y2="64" stroke="#FF3B00" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="174" y1="52" x2="162" y2="64" stroke="#FF3B00" stroke-width="2.5" stroke-linecap="square"/>
</svg>