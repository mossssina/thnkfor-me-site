<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears -->
  <polygon points="48,52 65,8 90,52" fill="#F8F8F8"/>
  <polygon points="110,52 135,8 152,52" fill="#F8F8F8"/>
  <polygon points="55,52 65,22 83,52" fill="#FF3B00"/>
  <polygon points="117,52 135,22 145,52" fill="#FF3B00"/>
  <!-- Head -->
  <rect x="42" y="52" width="116" height="92" fill="#F8F8F8"/>
  <!-- Asymmetric brows: left flat, right raised (curious) -->
  <line x1="64" y1="76" x2="88" y2="76" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="112" y1="68" x2="136" y2="74" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="square"/>
  <!-- Eyes: left squinting (thinking), right open (curious) -->
  <rect x="62" y="89" width="30" height="6" fill="#0A0A0A"/>
  <line x1="108" y1="88" x2="138" y2="94" stroke="#0A0A0A" stroke-width="4" stroke-linecap="square"/>
  <!-- Nose -->
  <rect x="96" y="110" width="8" height="6" fill="#FF3B00"/>
  <!-- Small open "hmm" mouth -->
  <rect x="93" y="118" width="14" height="7" fill="#0A0A0A"/>
  <!-- Whiskers -->
  <line x1="42" y1="112" x2="88" y2="114" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="42" y1="120" x2="88" y2="120" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="114" x2="158" y2="112" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="112" y1="120" x2="158" y2="120" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="58" y="144" width="84" height="62" fill="#F8F8F8"/>
  <!-- Collar -->
  <rect x="58" y="144" width="84" height="12" fill="#FF3B00"/>
  <rect x="94" y="155" width="12" height="10" fill="#0A0A0A"/>
  <!-- Left arm raised to chin -->
  <rect x="56" y="165" width="14" height="36" fill="#F8F8F8"/>
  <rect x="44" y="155" width="30" height="14" fill="#F8F8F8"/>
  <line x1="56" y1="155" x2="56" y2="166" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="68" y1="155" x2="68" y2="166" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Right paw (normal, floor) -->
  <rect x="110" y="200" width="38" height="16" fill="#F8F8F8"/>
  <line x1="122" y1="200" x2="122" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <line x1="134" y1="200" x2="134" y2="211" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- Tail: slight curious curl -->
  <polyline points="142,185 166,174 170,204" fill="none" stroke="#F8F8F8" stroke-width="9" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- ? mark (orange, geometric) -->
  <text x="168" y="50" font-family="'IBM Plex Mono', monospace" font-size="22" font-weight="500" fill="#FF3B00">?</text>
</svg>